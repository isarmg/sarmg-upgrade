[package]
name = "sarmg-upgrade"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
authors = ["sarmg <isarmg@163.com>"]
license = "Apache-2.0"
description = "Offline upgrade, backup, verification, and restore tooling for Sarmg products"
publish = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
hkdf = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
rustix = { version = "1.1", features = ["fs", "process", "time"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
