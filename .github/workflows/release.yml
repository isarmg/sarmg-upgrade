name: Formal release

on:
  push:
    tags:
      - v0.3.0

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and target
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add x86_64-unknown-linux-gnu --toolchain 1.98.0
      - name: Install archive dependency
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - name: Run complete quality gate
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
      - name: Stage unsigned release input
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: ./scripts/stage-release.sh "$RUNNER_TEMP/sarmg-upgrade-stage"
      - name: Upload immutable release input
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarmg-upgrade-release-input-${{ github.sha }}
          path: ${{ runner.temp }}/sarmg-upgrade-stage
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download only the verified build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sarmg-upgrade-release-input-${{ github.sha }}
          path: ${{ runner.temp }}/release-input
      - name: Install archive dependency
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - name: Materialize release signing key
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
        run: |
          test -n "$RELEASE_SIGNING_KEY_PEM"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY_PEM" >"$RUNNER_TEMP/release-signing-key.pem"
      - name: Sign, package, and re-verify
        run: |
          "$RUNNER_TEMP/release-input/release-tools/finalize-release.sh" \
            "$RUNNER_TEMP/release-input/package" \
            "$RUNNER_TEMP/release-signing-key.pem" \
            "$RUNNER_TEMP/final-release"
      - name: Publish exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "sarmg-upgrade 0.3.0" \
            --generate-notes \
            "$RUNNER_TEMP/final-release/"*
