name: CI

on:
  push:
  pull_request:

# Deny every token capability by default. The job grants only the read access
# needed to check out this repository.
permissions: {}

jobs:
  xcsc-source:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: product
          persist-credentials: false
      - name: Check out the exact official xcsc source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: isarmg/xcsc
          ref: c45e48e93e360542c2e1db6c6441a9e29b344b03
          path: xcsc-policy
          persist-credentials: false
      - name: Verify manifest, immutable dependencies and exact lock source
        run: python3 xcsc-policy/scripts/check-xcsc.py --product-root product

  quality:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enforce workflow supply-chain policy
        run: ./scripts/check-workflow-supply-chain.py

      - name: Test release identity checks
        run: python3 tests/test_finalize_release.py

      - name: Test actual offline release documentation closure
        run: python3 tests/test_release_docs.py

      - name: Test signed product upgrade packaging
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy

      - name: Verify Rust toolchain
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: rustc --version --verbose

      - name: Check formatting
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: cargo fmt --all -- --check

      - name: Check all targets and features
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: cargo check --locked --all-targets --all-features

      - name: Lint all targets and features
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test all targets and features
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: cargo test --locked --all-targets --all-features
