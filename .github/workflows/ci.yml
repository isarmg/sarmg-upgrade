name: CI

on:
  push:
  pull_request:

# Deny every token capability by default. The job grants only the read access
# needed to check out this repository.
permissions: {}

jobs:
  quality:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enforce workflow supply-chain policy
        run: ./scripts/check-workflow-supply-chain.py

      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Verify Rust toolchain
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: rustc --version --verbose

      - name: Check formatting
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo fmt --all -- --check

      - name: Check all targets and features
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo check --locked --all-targets --all-features

      - name: Lint all targets and features
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test all targets and features
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo test --locked --all-targets --all-features
